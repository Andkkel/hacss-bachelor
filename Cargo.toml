[package]
name = "hacss"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
hax-lib = { git = "https://github.com/hacspec/hax", version = "0.3.6"}

zeroize = "1.8.2"
proptest = "1.11.0"


[target.'cfg(not(hax))'.dependencies]
libcrux-aead = "0.0.7"
libcrux-ml-dsa = "0.0.9"
libcrux-hkdf = "0.0.6"
libcrux-ecdh = "0.0.6"
libcrux-hmac = "0.0.6"
libcrux-ml-kem = { version = "0.0.8", features = ["mlkem768", "incremental"] }
libcrux-sha3 = "0.0.8"
aes = "0.9.1"
cbc = "0.2.1"
rand = "0.9.2"
futures-util = "0.3.32"

[patch.crates-io]
hax-lib = { git = "https://github.com/hacspec/hax", rev = "ad110bfa7a2589e4e744e751a8d8b144cfe53c40"}
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[dev-dependencies]
spqr = { git = "https://github.com/signalapp/SparsePostQuantumRatchet"}

libsignal-protocol = { git = "https://github.com/signalapp/libsignal", package = "libsignal-protocol", rev = "5441a83"}
